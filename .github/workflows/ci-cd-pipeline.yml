        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: application-artifact
          path: ./dist/
        continue-on-error: true #remove later

      # OIDC Azure Log in (No long lived creds)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true #remove later


      - name: Deploy to Dev environment
        run: |
          echo "Stage 5: Deploy to Dev"
          echo "Environment: Dev"
          echo "Artifact:    ${{ env.APP_NAME }}:${{ github.sha }}"
          echo "Deploy tool: pending (Helm / Azure CLI / Terraform)"
          echo "Placeholder: ./scripts/deploy.sh dev"
          #./scripts/deploy.sh dev

      - name: Health Check Dev
        run: |
          echo "Health Check Pending"
          echo "Expected: HTTP 200 from /health endpoint"
          echo "Placeholder: ./scripts/deploy.sh dev"
          #./scripts/deploy.sh dev

# Integration + Performance Tests
