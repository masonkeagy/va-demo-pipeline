# Full CI/CD Pipeline Skeleton
# Ready for real tools to be plugged in

name: VA Demo CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

#Default to least privilege
permissions:
  contents: read

# Global Settings
env:
  PIPELINE_NAME: "VA Demo CI/CD Pipeline"
  APP_NAME: "placeholder-for-team"
  REGISTRY: "placeholder-for-team"


# Stage 1: Pull Request Validation
jobs:
  
  pr_validation:
    name: "Stage 1 - PR Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate PR
        run: |
          echo "Stage 1: Pull Request Validation"
          echo "Event Type: ${{ github.event_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Actor:      ${{ github.actor }}"
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo ""
            echo "PR-Specific Details:"
            echo "PR Author:  ${{ github.actor }}"
            echo "PR Branch:  ${{ github.head_ref }}"
            echo "Target:     ${{ github.base_ref }}"
            echo "PR Number:  ${{ github.event.pull_request.number }}"
          else
            echo ""
            echo "Push/Workflow Dispatch event - PR details not available"
          fi
          echo ""
          echo "Validation passed"

# Stage 2: Unit Testing
  unit_tests:
    name: "Stage 2 - Unit Tests"
    runs-on: ubuntu-latest
    needs: pr_validation
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unit Test Stage
        run: |
          echo "Stage 2: Unit Testing"
          echo "Currently a complete placeholder for this stage, would need actual code/tests in order to deem a pass"
          echo "Unit Test Placeholder Passed"
          #./scripts/unit-tests.sh

      - name: Code Coverage
        run: |
          echo "Code Coverage: Placeholder"
          echo "Coverage threshold: 80%"
          # ./scritps/coverage.sh

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
        continue-on-error: true #remove later

#Stage 3: Security Scanning
  security_scanning:
    name: "Stage 3 - Security Scanning"
    runs-on: ubuntu-latest
    needs: unit_tests
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

        # CodeQL SAST
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript #for now so we can run this stage placholder
        continue-on-error: true #remove later (Just so build doesnt fail for now)

      - name: CodeQL Autobuild
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true #remove later

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true # remove later

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        continue-on-error: true #remove later

      # Software Composition Analysis
      - name: Dependency Security Scan
        run: |
          echo "Software Composition Analysis (SCA)"
          echo "Scanning dependencies for known vulnerabilities"
          echo "Tool: Placeholder - ./scripts/dependency-scan.sh"
          echo "Will check: package.json / pom.xml / requirements.txt"
          #./scripts/dependency-scan.sh
        continue-on-error: true #remove later

      #Secret Detection
      - name: Secret Detection
        run: |
          echo "Secret Detection Scan"
          echo "Scanning for exposed credentials, tokens, API keys"
          echo "Tool: Placeholder - ./scripts/secret-scan.sh"
          echo "Will check: all files for hardcoded secrets"
          #./scripts/secret-scan.sh

      # Infrastructure as Code Security
      - name: IaC Security Scan
        run: |
          echo "Infrastructure as Code Security Scan"
          echo "Scanning IaC files for misconfigurations"
          echo "Tool: Placeholder - ./scripts/iac-scan.sh"
          echo "Will check: Terraform, Bicep, ARM templates"
          # ./scripts/iac-scan.sh
        continue-on-error: true #remove later

      - name: Security Scan Summary
        run: |
          echo "Stage 3: Security Scanning Complete"
          echo "CodeQL SAST:              Configured"
          echo "Secret Scanning:          GitHub Native + Script"
          echo "Dependency Scanning:      Configured"
          echo "Software Composition:     Configured"
          echo "IaC Security:             Configured"
          echo "Results location:         GitHub Security Tab"

# Stage 4: Build + Artifact Signing
  build_and_sign:
    name: "Stage 4 - Build and Artifact Signing"
    runs-on: ubuntu-latest
    needs: security_scanning
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact-tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Artifact Tag 
        id: set_tag
        run: |
          TAG="${{ github.sha }}"
          echo "tag=${TAG} >> $GITHUB_OUTPUT"
          echo "Artifact tag set to: ${TAG}"

      - name: Build Application
        run: |
          echo "Stage 4: Build Application"
          echo "Build tool:       [Pending... Dockerfile/pom.xml/package.json]"
          echo "Artifact tag:     ${{ github.sha }}"
          echo "Placeholder: ./scripts/build.sh"
          #./scripts/build.sh

      # SBOM Generation
      - name: Generate SBOM
        run: |
          echo "Generating Software Bill of Materials (SBOM)"
          echo "Tool: Placeholder - Syft / Anchore"
          echo "Output: sbom/ directory"
          echo "Placeholder: ./scripts/generate-sbom.sh"
          #./scripts/generate-sbom.sh
        continue-on-error: true #remove later

      - name: Package Application
        run: |
          echo "Packaging Application"
          echo "Placeholder: ./scripts/package.sh"
          #./scripts/package.sh

      - name: Sign Artifact
        run: |
          echo "Artifact Signing Tool: Cosign / Azure Key Vault"
          echo "Signing Status:        Pending registry setup"
          echo "Placeholder - cosign sign will execute here"

      # Upload Artifacts
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-artifact
          path: ./dist/
        continue-on-error: true #remove later

      #Upload SBOM
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ./sbom/
        continue-on-error: true #remove later

      - name: Build Summary
        run: |
          echo "Build Stage Complete"
          echo "Artifact: ${{ env.APP_NAME }}:${{ github.sha }}"
          echo "SBOM: Generated (placeholder)"
          echo "Signed: Pending"
          echo "Pushed: Pending"


# Deploy to Dev
  deploy_dev:
    name: "Stage 5 - Deploy to Dev"
    runs-on: ubuntu-latest
    needs: build_and_sign
    environment:
      name: dev    #will be created in GitHub repo settings
      url: https://fakeurl.com # updated later
    steps:
