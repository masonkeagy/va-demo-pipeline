# Secret Stage 12: For the Visual Demo
  publish_pipeline_status:
    name: "Publish Pipeline Status"
    runs-on: ubuntu-latest
    if: always()

    needs:
      - pr_validation
      - unit_tests
      - security_scanning
      - build_and_sign
      - deploy_dev
      - integration_tests
      - dast_security_scan
      - deploy_uat
      - regression_tests
      - deploy_preprod
      - deploy_prod
      - smoke_tests
      - monitoring_summary

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Regression Results
        uses: actions/download-artifact@v4
        with:
          name: regression-test-results-stage-8
          path: ./download-results


      - name: Verify Download
        run: |
          echo "Downloaded files:"
          find download-results -type f

      - name: Copy Regression Results
        run: |

          mkdir -p pipeline-dashboard/regression

          cp download-results/regression-summary.json \
            pipeline-dashboard/regression/ || true

          cp download-results/ai-review.json \
            pipeline-dashboard/regression/ || true

          cp download-results/performance-summary.json \
            pipeline-dashboard/regression/ || true

          cp download-results/a11y-results.json \
            pipeline-dashboard/regression/ || true

      - name: Verify Download
        run: |
          find download-results -type f

      - name: Create Pipeline Status
        env:
          PR_VALIDATION: ${{ needs.pr_validation.result }}
          UNIT_TESTS: ${{ needs.unit_tests.result }}
          SECURITY_SCANNING: ${{ needs.security_scanning.result }}
          BUILD_AND_SIGN: ${{ needs.build_and_sign.result }}
          DEPLOY_DEV: ${{ needs.deploy_dev.result }}
          INTEGRATION_TESTS: ${{ needs.integration_tests.result }}
          DAST_SECURITY_SCANNING: ${{ needs.dast_security_scan.result }}
          DEPLOY_UAT: ${{ needs.deploy_uat.result }}
          REGRESSION_TESTS: ${{ needs.regression_tests.result }}
          DEPLOY_PREPROD: ${{ needs.deploy_preprod.result }}
          DEPLOY_PROD: ${{ needs.deploy_prod.result }}
          SMOKE_TESTS: ${{ needs.smoke_tests.result }}
          MONITORING: ${{ needs.monitoring_summary.result }}

          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          SERVER_URL: ${{ github.server_url }}

          ARTIFACT_VERSION: ${{ needs.build_and_sign.outputs.artifact-version }}
          ARTIFACT_TAG: ${{ needs.build_and_sign.outputs.artifact-tag }}

        run: |
          mkdir -p pipeline-dashboard

          cp demo-console/index.html pipeline-dashboard/index.html

          mkdir -p pipeline-dashboard/regression

          cp download-results/regression-summary.json \
            pipeline-dashboard/regression/ || true

          cp download-results/ai-review.json \
            pipeline-dashboard/regression/ || true

          cp download-results/performance-summary.json \
            pipeline-dashboard/regression/ || true

          cp download-results/a11y-results.json \
            pipeline-dashboard/regression/ || true

          jq -n \
            --arg generatedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg repository "$REPOSITORY" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg runId "$RUN_ID" \
            --arg runNumber "$RUN_NUMBER" \
            --arg runAttempt "$RUN_ATTEMPT" \
            --arg sha "$COMMIT_SHA" \
            --arg branch "$BRANCH_NAME" \
            --arg actor "$ACTOR" \
            --arg eventName "$EVENT_NAME" \
            --arg runUrl "$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID" \
            --arg version "$ARTIFACT_VERSION" \
            --arg tag "$ARTIFACT_TAG" \
            --arg prValidation "$PR_VALIDATION" \
            --arg unitTests "$UNIT_TESTS" \
            --arg securityScanning "$SECURITY_SCANNING" \
            --arg buildAndSign "$BUILD_AND_SIGN" \
            --arg deployDev "$DEPLOY_DEV" \
            --arg integrationTests "$INTEGRATION_TESTS" \
            --arg deployUat "$DEPLOY_UAT" \
            --arg regressionTests "$REGRESSION_TESTS" \
            --arg deployPreprod "$DEPLOY_PREPROD" \
            --arg deployProd "$DEPLOY_PROD" \
            --arg smokeTests "$SMOKE_TESTS" \
            --arg monitoring "$MONITORING" \
            '{
              schemaVersion: 1,
              generatedAt: $generatedAt,
              repository: $repository,
              workflow: $workflow,
              run: {
                id: $runId,
                number: $runNumber,
                attempt: $runAttempt,
                url: $runUrl,
                event: $eventName,
                branch: $branch,
                sha: $sha,
                actor: $actor
              },
              artifact: {
                version: $version,
                tag: $tag
              },
              stages: [
                {
                  id: "pr_validation",
                  name: "PR validation",
                  result: $prValidation
                },
                {
                  id: "unit_tests",
                  name: "Unit tests",
                  result: $unitTests
                },
                {
                  id: "security_scanning",
                  name: "CodeQL and security",
                  result: $securityScanning
                },
                {
                  id: "build_and_sign",
                  name: "Build and sign",
                  result: $buildAndSign
                },
                {
                  id: "deploy_dev",
                  name: "Deploy to Dev",
                  result: $deployDev
                },
                {
                  id: "integration_performance_tests",
                  name: "Integration tests",
                  result: $integrationTests
                },
                {
                  id: "deploy_uat",
                  name: "Deploy to UAT",
                  result: $deployUat
                },
                {
                  id: "regression_tests",
                  name: "Regression tests",
                  result: $regressionTests
                },
                {
                  id: "deploy_preprod",
                  name: "Deploy to PreProd",
                  result: $deployPreprod
                },
                {
                  id: "deploy_prod",
                  name: "Deploy to Production",
                  result: $deployProd
                },
                {
                  id: "smoke_tests",
                  name: "Smoke tests",
                  result: $smokeTests
                },
                {
                  id: "monitoring_summary",
                  name: "Monitoring",
                  result: $monitoring
                }
              ]
            }' > pipeline-dashboard/pipeline-status.json

          echo "Generated pipeline status:"
          jq . pipeline-dashboard/pipeline-status.json

      - name: Verify Dashboard Contents
        run: |
          echo "Pipeline Dashboard:"
          find pipeline-dashboard -type f

      - name: Upload Pipeline Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-dashboard
          path: pipeline-dashboard/
          retention-days: 30

# Publish to GitHub Pages
  publish_demo_console:
    name: "Publish Demo Console to GitHub Pages"
    runs-on: ubuntu-latest
    if: always()
    needs: publish_pipeline_status
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Dashboard Artifact
        uses: actions/download-artifact@v4
        with:
          name: pipeline-dashboard
          path: ./dashboard

      - name: Verify Files
        run: |
          echo "Dashboard contents:"
          ls -lah dashboard/
          echo ""
          echo "Checking for index.html:"
          if [ -f dashboard/index.html ]; then
            echo "✓ index.html found"
          else
            echo "ERROR: index.html not found in dashboard/"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          force_orphan: true


           