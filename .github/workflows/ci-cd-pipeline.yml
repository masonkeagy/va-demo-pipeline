          echo "============================================"

# Stage 9A: Deploy to PreProd
  deploy_preprod:
    name: "Stage 9a - Deploy to PreProd"
    runs-on: ubuntu-latest
    needs:
      - regression_tests
      - build_and_sign
    environment:
      name: preprod
      url: https://preprod.placeholder.com
    permissions:
      contents: read
      id-token: write
    env:
      PREPROD_URL: "https://preprod.placeholder.com"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      # ============================================
      # Download Build Artifact
      # ============================================
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: application-artifact
          path: ./dist
      - name: Validate Deployment Artifacts
        run: |
          echo "============================================"
          echo "Artifact Validation"
          echo "============================================"
          ls -lah dist/
          TAR_FILE=$(find dist -name "*.tar.gz" | head -1)
          SIG_FILE=$(find dist -name "SIGNATURE.txt" | head -1)
          if [ -z "$TAR_FILE" ]; then
            echo "ERROR: Deployment package missing"
            exit 1
          fi
          if [ -z "$SIG_FILE" ]; then
            echo "ERROR: Signature file missing"
            exit 1
          fi
          echo ""
          echo "Deployment package:"
          echo "$TAR_FILE"
          echo ""
          echo "Signature file:"
          echo "$SIG_FILE"
          echo ""
          echo "✓ Artifact validation successful"
      # ============================================
      # Azure Login
      # ============================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true
      # ============================================
      # Generate Deployment Metadata
      # ============================================
