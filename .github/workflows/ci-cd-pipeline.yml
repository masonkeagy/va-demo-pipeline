            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          cat preprod-health.json
          echo ""
          echo "✓ PreProd validation successful"
      # ============================================
      # Upload Deployment Evidence
      # ============================================
      - name: Upload PreProd Deployment Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprod-deployment-artifacts
          path: |
            deployment-logs/
            release-metadata/
            preprod-config/
            preprod-health.json
      # ============================================
      # Stage Summary
      # ============================================
      - name: PreProd Deployment Summary
        if: always()
        run: |
