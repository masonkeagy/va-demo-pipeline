          kind: Deployment
          metadata:
            name: va-demo-pipeline-green
            namespace: preprod
          spec:
            replicas: 3
            selector:
              matchLabels:
                app: va-demo-pipeline
                slot: green
            template:
              metadata:
                labels:
                  app: va-demo-pipeline
                  slot: green
