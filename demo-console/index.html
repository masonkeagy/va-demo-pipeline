<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VA AI Platform Engineering Demo</title>

<style>
:root{
--bg:#08121c;
--panel:#121d28;
--surface:#1a2837;
--border:#33495d;
--text:#f5f8fc;
--muted:#91bad9;
--heading:#a9cdec;
--primary:#76b8ec;
--success:#66d69a;
--failure:#ff8580;
--accent:#4dd0e1;
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font:14px system-ui;
}

.container{
max-width:1600px;
margin:auto;
padding:20px;
}

.header{
background:var(--panel);
border:2px solid var(--border);
border-radius:12px;
padding:24px;
margin-bottom:20px;
text-align:center;
}

.header h1{
margin:0 0 10px;
color:var(--heading);
}

.layout{
display:grid;
grid-template-columns:400px 1fr;
gap:20px;
}

@media(max-width:1100px){
.layout{
grid-template-columns:1fr;
}
}

.panel{
background:var(--panel);
border:2px solid var(--border);
border-radius:12px;
padding:20px;
}

h2{
margin-top:0;
color:var(--heading);
}

button,a.button{
background:var(--primary);
color:#000;
font-weight:700;
padding:10px 14px;
border:none;
border-radius:8px;
cursor:pointer;
text-decoration:none;
display:inline-block;
}

textarea{
width:100%;
min-height:100px;
background:var(--surface);
border:1px solid var(--border);
border-radius:8px;
padding:10px;
color:white;
margin-bottom:12px;
}

.status{
display:flex;
align-items:center;
gap:10px;
margin-bottom:20px;
font-weight:bold;
}

.dot{
width:14px;
height:14px;
border-radius:50%;
}

.idle{background:#777;}
.running{background:var(--accent);}
.success{background:var(--success);}
.failure{background:var(--failure);}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}

.stat{
background:var(--surface);
padding:15px;
border-radius:8px;
text-align:center;
}

.stat-value{
font-size:26px;
font-weight:bold;
color:var(--accent);
}

.current-run{
padding:15px;
background:var(--surface);
border-radius:8px;
margin-bottom:20px;
}

.stages{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
}

.stage{
background:var(--surface);
border:2px solid var(--border);
border-radius:8px;
padding:10px;
text-align:center;
}

.stage.success{
border-color:var(--success);
}

.stage.failure{
border-color:var(--failure);
}

.stage.running{
border-color:var(--accent);
box-shadow:0 0 12px rgba(77,208,225,.3);
}

.stage-name{
font-weight:bold;
font-size:12px;
margin-bottom:10px;
}

.stage-status{
font-size:11px;
}

.pr-card{
background:var(--surface);
border-left:4px solid var(--border);
padding:12px;
margin-bottom:10px;
border-radius:6px;
}

.log{
background:#000;
padding:12px;
border-radius:8px;
height:250px;
overflow:auto;
font-family:Consolas;
font-size:11px;
}
</style>
</head>

<body>

<div class="container">

<header class="header">
<h1>VA AI Platform Engineering Demo</h1>
<p>AI Request → GitHub PR → Pipeline → Deployment</p>
</header>

<div class="layout">

<div class="panel">

<h2>AI Request Intake</h2>

<textarea id="requestText">
Create UAT environment for new release candidate
</textarea>

<button id="analyzeBtn">
Analyze Request
</button>

<div id="analysis" style="margin-top:15px"></div>

<hr style="margin:20px 0">

<h2>GitHub</h2>

<p>
Repository:
<b>masonkeagy/va-demo-pipeline</b>
</p>

<a
class="button"
href="https://github.com/masonkeagy/va-demo-pipeline/compare"
target="_blank">
Create Pull Request
</a>

<br><br>

<button id="refreshBtn">
Refresh Now
</button>

</div>

<div class="panel">

<h2>Pipeline Monitor</h2>

<div class="status">
<div id="statusDot" class="dot idle"></div>
<div id="statusText">Loading...</div>
</div>

<div class="stats">
<div class="stat">
<div id="totalPRs" class="stat-value">0</div>
<div>PRs</div>
</div>

<div class="stat">
<div id="progress" class="stat-value">0</div>
<div>Stages</div>
</div>

<div class="stat">
<div id="updated" class="stat-value">--</div>
<div>Updated</div>
</div>
</div>

<div class="current-run" id="runInfo">
Loading run information...
</div>

<div class="stages" id="stages">
</div>

<br>

<div class="log" id="logViewer"></div>

</div>

</div>

<br>

<div class="panel">

<h2>Recent Pull Requests</h2>

<div id="prs"></div>

</div>

</div>

<script>

const REPO = "masonkeagy/va-demo-pipeline";
const API = `https://api.github.com/repos/${REPO}`;

function el(id){
return document.getElementById(id);
}

function log(msg){

const viewer = el("logViewer");

viewer.innerHTML +=
`<div>${new Date().toLocaleTimeString()} | ${msg}</div>`;

viewer.scrollTop = viewer.scrollHeight;
}

el("analyzeBtn").addEventListener("click",()=>{

const text = el("requestText").value;

el("analysis").innerHTML=
`
<b>Intent:</b> Infrastructure Deployment<br>
<b>Risk:</b> Medium<br>
<b>Approval Required:</b> Yes<br>
<b>Execution Path:</b> GitHub Actions<br>
<b>Estimated Time:</b> 2 Hours
`;

log(`AI classified request: ${text}`);

});

async function loadPRs(){

try{

const response =
await fetch(
`${API}/pulls?state=all&per_page=10`
);

const prs = await response.json();

el("totalPRs").textContent =
prs.length;

el("prs").innerHTML =
prs.map(pr=>`
<div class="pr-card">
<b>#${pr.number}</b>
${pr.title}
<br>
<small>${pr.state}</small>
</div>
`).join("");

}catch(e){
log("PR load failed");
}

}

async function loadPipeline(){

try{

const runsResponse =
await fetch(
`${API}/actions/runs?per_page=50`
);

const runsData =
await runsResponse.json();

/*
LOOK FOR THE REAL PIPELINE
NOT THE GITHUB PAGES WORKFLOW
*/
const run =
runsData.workflow_runs.find(r =>
    r.name === "VA Demo CI/CD Pipeline"
);

if(!run){
    el("statusText").textContent =
      "Pipeline not found";
    return;
}

const jobsResponse =
await fetch(
`${API}/actions/runs/${run.id}/jobs`
);

const jobsData =
await jobsResponse.json();

const jobs =
jobsData.jobs || [];

/*
FORCE THE 12 STAGES TO ALWAYS EXIST
*/
const pipelineStages = [
{
id:"Stage 1 - PR Validation",
label:"PR Validation"
},
{
id:"Stage 2 - Unit Tests",
label:"Unit Tests"
},
{
id:"Stage 3 - Security Scanning",
label:"Security Scan"
},
{
id:"Stage 4 - Build and Artifact Signing",
label:"Build & Sign"
},
{
id:"Stage 5 - Deploy to Dev",
label:"Deploy Dev"
},
{
id:"Stage 6 - Integration and Security Tests",
label:"Integration Tests"
},
{
id:"Stage 7 - Deploy to TEST/UAT",
label:"Deploy UAT"
},
{
id:"Stage 8 - Regression Testing",
label:"Regression"
},
{
id:"Stage 9a - Deploy to PreProd",
label:"PreProd"
},
{
id:"Stage 9b - Deploy to Production",
label:"Production"
},
{
id:"Stage 10 - Smoke Tests and Rollback",
label:"Smoke Tests"
},
{
id:"Stage 11 - Monitoring Active",
label:"Monitoring"
}
];

let passed = 0;

const stageHtml =
pipelineStages.map(stage => {

const match =
jobs.find(j =>
j.name === stage.id
);

let css = "";
let status = "WAITING";

if(match){

if(match.status === "in_progress"){

css = "running";
status = "RUNNING";

}
else if(match.conclusion === "success"){

css = "success";
status = "SUCCESS";
passed++;

}
else if(match.conclusion === "failure"){

css = "failure";
status = "FAILED";

}
else if(match.status === "completed"){

status =
match.conclusion || "DONE";

}

}

return `
<div class="stage ${css}">
<div class="stage-name">
${stage.label}
</div>
<div class="stage-status">
${status}
</div>
</div>
`;

}).join("");

el("stages").innerHTML =
stageHtml;

el("progress").textContent =
`${passed}/12`;

el("updated").textContent =
new Date(run.updated_at)
.toLocaleTimeString();

el("runInfo").innerHTML =
`
<b>Workflow:</b>
${run.name}
<br>

<b>Branch:</b>
${run.head_branch}
<br>

<b>Run #:</b>
${run.run_number}
<br>

<b>Status:</b>
${run.status}
<br>

<b>Conclusion:</b>
${run.conclusion || "Running"}
`;

let pipelineState = "idle";

if(
jobs.some(
j => j.status === "in_progress"
)
){
pipelineState = "running";
}
else if(
jobs.some(
j => j.conclusion === "failure"
)
){
pipelineState = "failure";
}
else if(
passed === 12
){
pipelineState = "success";
}

el("statusDot").className =
`dot ${pipelineState}`;

async function refresh(){

el("refreshBtn").disabled = true;

await Promise.all([
loadPRs(),
loadPipeline()
]);

el("refreshBtn").disabled = false;

}

el("refreshBtn")
.addEventListener("click",refresh);

refresh();

setInterval(refresh,2000);

</script>

</body>
</html>
